name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: make test race vet cross
      - name: No private or cache files tracked
        run: |
          test -z "$(git ls-files .local pkg bin dist)"
      - name: Dependencies are reproducible
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
